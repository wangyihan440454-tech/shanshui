<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>山水 · 交互验证</title></head><body><div id="root"></div><output id="test-workers" style="position:fixed;top:0;left:45%;z-index:10000;padding:4px;background:#171c18;color:#fff;font:11px monospace"></output><script type="module">
const mode=new URLSearchParams(location.search).get('mode');
let count=0;
const NativeWorker=window.Worker;
window.Worker=class extends NativeWorker{
 constructor(...args){if(mode==='failure')throw new Error('QA: Worker unavailable');super(...args);count++;this.active=true;}
 postMessage(...args){if(mode==='slow'){this.pending=setTimeout(()=>super.postMessage(...args),5000);}else super.postMessage(...args);}
 terminate(){clearTimeout(this.pending);if(this.active){this.active=false;count--;}super.terminate();}
};
if(mode==='reduced'){
 const nativeMatch=window.matchMedia.bind(window);
 window.matchMedia=query=>query==='(prefers-reduced-motion: reduce)'?{matches:true,media:query,onchange:null,addEventListener(){},removeEventListener(){},addListener(){},removeListener(){},dispatchEvent(){return true;}}:nativeMatch(query);
}
setInterval(()=>{document.getElementById('test-workers').textContent='QA '+mode+' / workers: '+count},100);
if(mode==='no-webgl'){
 const nativeContext=HTMLCanvasElement.prototype.getContext;
 HTMLCanvasElement.prototype.getContext=function(type,...args){return (type==='webgl'||type==='webgl2')?null:nativeContext.call(this,type,...args)};
}
if(mode==='ink'){
 const sweep=document.createElement('button');sweep.textContent='模拟轻扫';sweep.style='position:fixed;right:16px;top:62px;z-index:10000;background:#34443d;color:white;padding:8px';
 sweep.onclick=()=>{const view=document.querySelector('.scroll-viewport');if(!view)return;const r=view.getBoundingClientRect();let i=0;const timer=setInterval(()=>{view.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerType:'mouse',buttons:0,clientX:r.left+r.width*(.24+i/180),clientY:r.top+r.height*.5+Math.sin(i*.04)*40}));if(++i>90)clearInterval(timer)},16)};
 document.body.appendChild(sweep);
}
import('/src/main.tsx');
</script></body></html>
