<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山川立境</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; background: #f7efe3; color: #30382f; font: 16px STKaiti, KaiTi, serif; }
    header, footer { padding: 12px clamp(12px, 3vw, 28px); }
    header { display: flex; justify-content: flex-end; }
    button, a { color: inherit; font: inherit; }
    header button, #huashan-link { padding: 8px 14px; border: 1px solid #aa9e87; background: #fffaf1; cursor: pointer; }
    main { display: grid; place-items: center; }
    svg { display: block; width: 100%; height: min(78dvh, 1100px); }
    .province { fill: transparent; stroke: transparent; cursor: pointer; }
    .province:hover, .province:focus-visible, .province[aria-pressed="true"] { fill: #fff6b55c; stroke: #704707; stroke-width: 2; }
    footer { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 14px; font-size: 14px; text-align: center; }
    #huashan-link { text-decoration: none; }
</style>
<header><button type="button" id="topics">专题首页</button></header>
<main>
    <svg viewBox="0 0 1482 1061" aria-label="中国地理风光图" id="map">
        <image href="./china-scenery.png" width="1482" height="1061"/>
    </svg>
</main>
<footer>
    <span id="selection" aria-live="polite">本图暂时只能打开华山三维，请点击陕西板块进行查看。</span>
    <a id="huashan-link" href="./huashan/index.html?view=hero" hidden>进入华山三维 →</a>
</footer>
<script>
    const map = document.getElementById('map');
    const selection = document.getElementById('selection');
    const huashan = document.getElementById('huashan-link');
    document.getElementById('topics').onclick = () => {
        if (parent === window) location.href = '/#/hub';
        else parent.postMessage({type: 'shanshui:return-hub'}, location.origin);
    };
    const provinces = [
        ['新疆', 350, 369, 72, 32], ['西藏', 348, 581, 65, 24], ['青海', 540, 519, 44, 22],
        ['甘肃', 680, 507, 23, 16], ['宁夏', 732, 506, 17, 15], ['内蒙古', 780, 408, 56, 20],
        ['黑龙江', 1094, 244, 47, 23], ['吉林', 1101, 347, 30, 17], ['辽宁', 1035, 380, 30, 16],
        ['北京', 950, 412, 15, 12], ['天津', 977, 449, 14, 11], ['河北', 926, 468, 22, 16],
        ['山西', 853, 487, 25, 16], ['陕西', 787, 523, 26, 40], ['山东', 978, 511, 25, 18],
        ['河南', 868, 605, 27, 17], ['江苏', 1009, 584, 23, 16], ['上海', 1091, 640, 14, 10],
        ['安徽', 959, 642, 24, 18], ['浙江', 1049, 673, 24, 17], ['湖北', 853, 645, 24, 15],
        ['四川', 630, 674, 43, 25], ['重庆', 733, 681, 19, 16], ['江西', 938, 711, 23, 18],
        ['湖南', 845, 745, 24, 16], ['福建', 1015, 751, 21, 17], ['贵州', 724, 761, 26, 16],
        ['云南', 613, 795, 33, 22], ['广西', 750, 821, 34, 18], ['广东', 889, 829, 29, 17],
        ['香港', 979, 864, 14, 9], ['澳门', 923, 888, 14, 9], ['海南', 795, 950, 24, 15],
        ['台湾', 1082, 827, 15, 33],
    ];
    let active;
    for (const [name, x, y, width, height] of provinces) {
        const spot = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        spot.classList.add('province');
        for (const [key, value] of Object.entries({cx: x, cy: y, rx: width, ry: height, role: 'button', tabindex: 0, 'aria-label': name, 'aria-pressed': 'false'})) {
            spot.setAttribute(key, value);
        }
        const select = () => {
            if (name === '陕西' && active === spot) {
                location.href = huashan.href;
                return;
            }
            active?.setAttribute('aria-pressed', 'false');
            active = spot;
            spot.setAttribute('aria-pressed', 'true');
            huashan.hidden = name !== '陕西';
            selection.textContent = name === '陕西'
                ? '已选中陕西 · 西岳华山'
                : name + ' · 本图暂时只开放陕西华山三维。';
        };
        spot.addEventListener('click', select);
        spot.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            select();
        });
        map.append(spot);
    }
    map.querySelector('image').addEventListener('error', () => location.replace('./district-map.html'));
</script>
</html>
