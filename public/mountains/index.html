<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/examples/jsm/renderers/CSS2DRenderer.js';
const d3=window.d3;

/*    配置与数据映射（暂时只跳转贵州）*/
const PROVINCE_INFO = {
    "北京市": { img: "https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=800&q=80", desc: "故宫：红墙黄瓦，是明清两代的皇家宫殿。" },

    "台湾省": { img: "https://images.unsplash.com/photo-1508243743136-8775881c034f?auto=format&fit=crop&w=800&q=80", desc: "日月潭：台湾最大的天然淡水湖。" },
    "贵州省": { img: "https://images.unsplash.com/photo-1505562130589-4be92bcebc39?auto=format&fit=crop&w=800&q=80", desc: "黄果树瀑布：世界著名大瀑布之一，喀斯特地貌的杰作。" }
};

const PROVINCE_PAGES = {
    "陕西省": "./huashan/index.html?view=hero",

    "北京市": "./scenes/beijing.html", 
    "云南省": "./scenes/yunnan.html",
    "四川省": "./scenes/sichuan.html", 
    "西藏自治区": "./scenes/xizang.html",
    "新疆维吾尔自治区": "./scenes/xinjiang.html", 
    "台湾省": "./scenes/taiwan.html",
    "贵州省": "./guizhou.html" 
};

const PROVINCE_COLORS = {
    "新疆维吾尔自治区": 0xE8D1A7, "西藏自治区": 0xE6BCC7, "青海省": 0xB4CDD8, "内蒙古自治区": 0xCBDBA9,
    "黑龙江省": 0xBACFBC, "吉林省": 0xE7C9D3, "辽宁省": 0xE1C2C2, "甘肃省": 0xE5D3B3,
    "宁夏回族自治区": 0xE1D5AE, "陕西省": 0xF2D4A8, "山西省": 0xD9B9B3, "河北省": 0xE8D8C8,
    "北京市": 0xD2A6A6, "天津市": 0xD2A6A6, "山东省": 0xE5D3B3, "河南省": 0xF0DBB0,
    "安徽省": 0xD4E1D5, "江苏省": 0xD4E1D5, "浙江省": 0xC8D8C4, "上海市": 0xC8D8C4,
    "福建省": 0xE3D5BB, "江西省": 0xE3D5BB, "湖北省": 0xE5E0C8, "湖南省": 0xE5E0C8,
    "广东省": 0xD8E2D0, "广西壮族自治区": 0xD8E2D0, "海南省": 0xC8D8C4, "台湾省": 0xE8C2C4,
    "四川省": 0xE1C2C2, "重庆市": 0xE1C2C2, "贵州省": 0xD1E4D2, "云南省": 0xD8C8D0
};

const DEFAULT_COLOR = 0xE0DCD3;

function getHoverColor(baseColorHex) {
    const color = new THREE.Color(baseColorHex);
    const hsl = { h: 0, s: 0, l: 0 };
    color.getHSL(hsl);
    color.setHSL(hsl.h, Math.min(hsl.s + 0.4, 1.0), Math.max(hsl.l - 0.2, 0.3)); 
    return color;
}

function getActiveColor(baseColorHex) {
    const color = new THREE.Color(baseColorHex);
    const hsl = { h: 0, s: 0, l: 0 };
    color.getHSL(hsl);
    color.setHSL(hsl.h, Math.min(hsl.s + 0.5, 1.0), Math.max(hsl.l - 0.3, 0.2)); 
    return color;
}

function getProvincePage(name) {
    if (PROVINCE_PAGES[name]) return PROVINCE_PAGES[name];
    return `./scenes/${encodeURIComponent(name)}.html`;
}

let isNavigating = false;
function openProvincePage(name) {
    if (name !== "陕西省") return;

    if (isNavigating) return;
    isNavigating = true;
    const url = getProvincePage(name);
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:#F0F3F5;opacity:0;transition:opacity .5s ease;z-index:9999;pointer-events:none;';
    document.body.appendChild(overlay);
    requestAnimationFrame(() => { overlay.style.opacity = '1'; });
    setTimeout(() => { window.location.href = url; }, 520);
}

/*  渲染器 / 场景 / 相机 */
const container = document.getElementById('canvas-container');
const labelContainer = document.getElementById('labels-container');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
labelRenderer.domElement.style.pointerEvents = 'none';
labelContainer.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xF0F3F5);
scene.fog = new THREE.FogExp2(0xF0F3F5, 0.0012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(0, 0, 450);

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
keyLight.position.set(-100, 200, 400);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(200, -100, -200);
scene.add(fillLight);

const mapGroup = new THREE.Group();
scene.add(mapGroup);

/*   地图构建 */
let provinceMeshes = [];
let mapReady = false;
const loaderEl = document.getElementById('loader');

async function buildMap() {
    let geoData;
    try {
        geoData = await d3.json("./china.json");
    } catch (err) {
        loaderEl.innerHTML = "地图数据加载失败";
        return;
    }

    const mapScale = Math.min(window.innerWidth / 5.5, window.innerHeight / 3.5);
    const projection = d3.geoMercator().center([104, 36]).scale(mapScale).translate([0, 0]);

    const extrudeSettings = { depth: 5, bevelEnabled: false, steps: 1 };
    const outlineMaterial = new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.6 });

    const collected = [];

    geoData.features.forEach(feature => {
        const name = feature.properties.name;
        const geom = feature.geometry;
        if (!name || !geom) return;

        let polygons = geom.type === 'Polygon' ? [geom.coordinates] : (geom.type === 'MultiPolygon' ? geom.coordinates : null);
        if (!polygons) return;

        const extGeoms = [];
        const outlineVerts = [];

        const projectRing = (ring) => {
            const pts = [];
            for (let i = 0; i < ring.length; i++) {
                const [x, y] = projection(ring[i]);
                const v = new THREE.Vector2(x, -y);
                if (!pts.length || pts[pts.length - 1].distanceToSquared(v) > 1e-4) pts.push(v);
            }
            if (pts.length > 1 && pts[0].distanceToSquared(pts[pts.length - 1]) < 1e-4) pts.pop();
            return pts;
        };

        polygons.forEach(polygon => {
            if (!polygon || !polygon.length) return;
            const outer = projectRing(polygon[0]);
            if (outer.length < 3) return;

            const shape = new THREE.Shape(outer);
            for (let i = 1; i < polygon.length; i++) {
                const hole = projectRing(polygon[i]);
                if (hole.length >= 3) shape.holes.push(new THREE.Path(hole));
            }

            try { extGeoms.push(new THREE.ExtrudeGeometry(shape, extrudeSettings)); } catch (e) {}

            polygon.forEach(ring => {
                const pts = projectRing(ring);
                if (pts.length < 3) return;
                for (let i = 0; i < pts.length; i++) {
                    const a = pts[i], b = pts[(i + 1) % pts.length];
                    outlineVerts.push(a.x, a.y, 5.1, b.x, b.y, 5.1); 
                }
            });
        });

        if (!extGeoms.length) return;

        let mergedGeometry;
        if (THREE.BufferGeometryUtils && THREE.BufferGeometryUtils.mergeBufferGeometries) {
            mergedGeometry = THREE.BufferGeometryUtils.mergeBufferGeometries(extGeoms, false);
        } else {
            const positions = [];
            extGeoms.forEach(g => {
                const pos = g.attributes.position, index = g.index;
                if(index) { for(let i=0; i<index.count; i++) positions.push(pos.getX(index.getX(i)), pos.getY(index.getX(i)), pos.getZ(index.getX(i))); }
                else { for(let i=0; i<pos.count; i++) positions.push(pos.getX(i), pos.getY(i), pos.getZ(i)); }
            });
            mergedGeometry = new THREE.BufferGeometry();
            mergedGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            mergedGeometry.computeVertexNormals();
        }
        
        if(!mergedGeometry) return;

        mergedGeometry.computeBoundingBox();
        const center = mergedGeometry.boundingBox.getCenter(new THREE.Vector3());
        mergedGeometry.translate(-center.x, -center.y, -center.z);

        const outlineGeo = new THREE.BufferGeometry();
        outlineGeo.setAttribute('position', new THREE.Float32BufferAttribute(outlineVerts, 3));
        outlineGeo.translate(-center.x, -center.y, 0);

        collected.push({ name, geometry: mergedGeometry, outlineGeo, offset: new THREE.Vector3(center.x, center.y, 0) });
    });

    const globalBox = new THREE.Box3().setFromPoints(collected.map(p => p.offset));
    const globalCenter = globalBox.getCenter(new THREE.Vector3());

    collected.forEach(p => {
        const baseHex = PROVINCE_COLORS[p.name] || DEFAULT_COLOR;
        const baseColor = new THREE.Color(baseHex);
        const hoverColor = getHoverColor(baseHex);
        const activeColor = getActiveColor(baseHex);

        const material = new THREE.MeshStandardMaterial({
            color: baseColor.clone(), roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide,
            emissive: 0x000000, emissiveIntensity: 0
        });

        const mesh = new THREE.Mesh(p.geometry, material);
        mesh.position.set(p.offset.x - globalCenter.x, p.offset.y - globalCenter.y, 0);

        mesh.add(new THREE.LineSegments(p.outlineGeo, outlineMaterial));

        mesh.userData = {
            isProvince: true, name: p.name,
            originPos: mesh.position.clone(), originRot: mesh.rotation.clone(),
            targetColor: baseColor.clone(),
            baseColor, hoverColor, activeColor,
            setState(state) {
                this.targetColor.copy(state === 'hover' ? this.hoverColor : state === 'active' ? this.activeColor : this.baseColor);
                this.targetEmissive = state === 'hover' ? 0x222222 : 0x000000;
            }
        };

        const div = document.createElement('div');
        div.className = 'province-label';
        div.textContent = p.name.replace('维吾尔自治区', '').replace('壮族自治区', '').replace('回族自治区', '')
                                .replace('特别行政区', '').replace('自治区', '').replace('省', '').replace('市', '');
   
        const label = new CSS2DObject(div);
        label.position.set(0, 0, 5.2); 
        
        if (p.name === '香港特别行政区') label.position.set(0, -12, 5.2);
        if (p.name === '澳门特别行政区') label.position.set(0, -18, 5.2);
        if (p.name === '上海市') label.position.set(-5, 0, 5.2);

        mesh.add(label);
        mesh.userData.label = label;

        mapGroup.add(mesh);
        provinceMeshes.push(mesh);
    });

    const bounds = new THREE.Box3().setFromObject(mapGroup);
    const halfWidth = Math.max(-bounds.min.x, bounds.max.x);
    const halfHeight = Math.max(-bounds.min.y, bounds.max.y);
    const halfViewHeight = (camera.position.z - bounds.max.z) * Math.tan(THREE.MathUtils.degToRad(22.5));
    overviewZoom = Math.min(3, 0.97 * halfViewHeight * camera.aspect / halfWidth, 0.82 * halfViewHeight / halfHeight);
    setMapZoom(overviewZoom);
    mapReady = true;
    loaderEl.classList.add('hide');
    setTimeout(() => loaderEl.remove(), 800);
}

/* 交互逻辑 */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10, -10);
let hovered = null, selected = null;
let isDetailView = false;
let targetGroupY = 0, targetGroupRotX = 0;
const floatTargetPos = new THREE.Vector3(0, 30, 120);

let rafQueued = false, pendingEvent = null;
function updatePointer(e) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function updateHover() {
    if (!mapReady) return;
    raycaster.setFromCamera(pointer, camera);

    if (selected) {
        if (raycaster.intersectObject(selected, true).length > 0) {
            setHovered(null); document.body.style.cursor = 'pointer'; return;
        }
    }

    const hits = raycaster.intersectObjects(mapGroup.children, false);
    const mesh = hits.length ? hits[0].object : null;

    if (mesh && mesh.userData.isProvince && mesh !== selected) {
        setHovered(mesh); document.body.style.cursor = 'pointer';
    } else {
        setHovered(null); document.body.style.cursor = 'default';
    }
}

function setHovered(mesh) {
    if (hovered === mesh) return;
    if (hovered) hovered.userData.setState('base');
    hovered = mesh;
    if (hovered) hovered.userData.setState('hover');
}

window.addEventListener('pointermove', (e) => {
    pendingEvent = e;
    if (rafQueued) return;
    rafQueued = true;
    requestAnimationFrame(() => {
        rafQueued = false;
        if (!pendingEvent) return;
        updatePointer(pendingEvent); updateHover(); pendingEvent = null;
    });
}, { passive: true });

function handleClick(e) {
    if (!mapReady || isNavigating) return;
    updatePointer(e); 
    raycaster.setFromCamera(pointer, camera);

    if (selected && raycaster.intersectObject(selected, true).length > 0) {
        openProvincePage(selected.userData.name);
        return;
    }

    const hits = raycaster.intersectObjects(mapGroup.children, false);
    const mesh = hits.length ? hits[0].object : null;

    if (mesh && mesh.userData.isProvince) {
        if (selected === mesh) {
            resetView();
        } else {
            selectProvince(mesh);
        }
        return;
    }

    resetView();
}

function selectProvince(mesh) {
    resetView();
    selected = mesh;
    setHovered(null);
    selected.userData.setState('active');
    
    if (selected.userData.label) selected.userData.label.element.classList.add('hidden');

    scene.attach(selected);

    isDetailView = true;
    targetGroupY = -50;
    targetGroupRotX = -Math.PI / 3;

    const info = PROVINCE_INFO[mesh.userData.name] || {
        img: `https://picsum.photos/seed/${encodeURIComponent(mesh.userData.name)}/800/600`,
        desc: '华夏大地，每一寸山河都有其独特的神韵与故事。'
    };
    const imgEl = document.getElementById('card-image');
    imgEl.classList.remove('loaded');
    imgEl.onload = () => imgEl.classList.add('loaded');
    imgEl.src = info.img;
    document.getElementById('card-name').innerText = mesh.userData.name;
    document.getElementById('card-desc').innerText = info.desc;
    document.getElementById('info-card').classList.add('show');
}

function resetView() {
    if (selected) {
        mapGroup.attach(selected);
        selected.position.copy(selected.userData.originPos);
        selected.rotation.copy(selected.userData.originRot);
        selected.userData.setState('base');
        
        if (selected.userData.label) selected.userData.label.element.classList.remove('hidden');
        
        selected = null;
    }
    setHovered(null);
    isDetailView = false;
    targetGroupY = 0; targetGroupRotX = 0;
    document.body.style.cursor = 'default';
    document.getElementById('info-card').classList.remove('show');
}

let overviewZoom = 1;
let mapZoom = 1;
function setMapZoom(value) {
    mapZoom = Math.min(3, Math.max(0.65, value));
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(22.5)) / mapZoom));
    camera.updateProjectionMatrix();
}
window.addEventListener('wheel', (event) => {
    if (event.target instanceof Element && event.target.closest('#info-card')) return;
    event.preventDefault();
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1);
    setMapZoom(mapZoom * Math.exp(-Math.max(-100, Math.min(100, delta)) * 0.002));
}, { passive: false });
window.addEventListener('keydown', (event) => {
    if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.key === '+' || event.key === '=') { event.preventDefault(); setMapZoom(mapZoom * 1.15); }
    if (event.key === '-' || event.key === '_') { event.preventDefault(); setMapZoom(mapZoom / 1.15); }
    if (event.key === '0') setMapZoom(overviewZoom);
});

renderer.domElement.addEventListener('click', handleClick);
document.getElementById('info-card').addEventListener('click', (e) => e.stopPropagation());
document.getElementById('card-close').addEventListener('click', (e) => { e.stopPropagation(); resetView(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') resetView(); });

/*动画循环 */
const clock = new THREE.Clock();
const _camTarget = new THREE.Vector3();
const _lookTarget = new THREE.Vector3(0, 0, 0);
const _lookNow = new THREE.Vector3(0, 0, 0);

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    mapGroup.position.y += (targetGroupY - mapGroup.position.y) * 0.06;
    mapGroup.rotation.x += (targetGroupRotX - mapGroup.rotation.x) * 0.06;

    provinceMeshes.forEach(m => {
        m.material.color.lerp(m.userData.targetColor, 0.15);
        if (m.userData.targetEmissive) {
            m.material.emissive.lerp(new THREE.Color(m.userData.targetEmissive), 0.15);
        }
    });

    if (selected) {
        selected.position.lerp(floatTargetPos, 0.08);
        selected.rotation.x += (0 - selected.rotation.x) * 0.08;
        selected.rotation.y += (0 - selected.rotation.y) * 0.08;
        selected.rotation.z += 0.003; 
    }

    const idleX = Math.sin(t * 0.22) * 5;
    const idleY = Math.cos(t * 0.17) * 4;

    if (isDetailView) {
        _camTarget.set(idleX * 0.2, -20 + idleY * 0.2, 320);
        _lookTarget.set(0, 20, 0);
    } else {
        _camTarget.set(0, 0, 450);
        _lookTarget.set(0, 0, 0);
    }

    camera.position.lerp(_camTarget, 0.05);
    _lookNow.lerp(_lookTarget, 0.07);
    camera.lookAt(_lookNow);

    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
buildMap();
</script>
